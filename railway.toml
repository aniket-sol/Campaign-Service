[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "gunicorn Campaign_Service.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/"
healthcheckTimeout = 300

[deploy.worker]
startCommand = "celery -A Campaign_Service worker --loglevel=info"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Watch paths for triggering rebuilds
[deploy.watchPatterns]
patterns = [
    "**/*.py",
    "requirements.txt",
    "railway.toml"
]

# Environment variables will be set in Railway Dashboard
[variables]
DJANGO_SETTINGS_MODULE = "Campaign_Service.settings"
PYTHONUNBUFFERED = "1"